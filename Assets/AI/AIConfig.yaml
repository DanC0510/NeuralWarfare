behaviors:
  AIPlayer:
    trainer_type: ppo
    max_steps: 50000
    checkpoint_interval: 50000
    hyperparameters:
      batch_size: 64
      buffer_size: 2048
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize_input: true
      hidden_units: 256
      num_layers: 2
      activation: tanh